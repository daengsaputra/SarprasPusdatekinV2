version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: sarpras_nginx
    ports:
      - "9180:80"
    volumes:
      - .:/var/www/html
      - sarpras-vendor:/var/www/html/vendor
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./storage/logs/nginx:/var/log/nginx
    depends_on:
      - php-fpm
    networks:
      - sarpras-network
    restart: unless-stopped

  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile.phpfpm
    container_name: sarpras_phpfpm
    volumes:
      - .:/var/www/html
      - sarpras-vendor:/var/www/html/vendor
      - ./php/php.ini:/usr/local/etc/php/php.ini
      - ./php/php-fpm.conf:/usr/local/etc/php-fpm.d/www.conf
    environment:
      - PHP_FPM_PM=static
      - PHP_FPM_PM_MAX_CHILDREN=40
    networks:
      - sarpras-network
    restart: unless-stopped

  db:
    image: mysql:8.0.30
    container_name: sarpras_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootnihbener@!444r00tsarpras
      MYSQL_DATABASE: sarpras-bpip
      MYSQL_USER: sarprasuser
      MYSQL_PASSWORD: rootnihbener@!444
    ports:
      - 9470:3306
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - sarpras-network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sarpras_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 300M
      PMA_ARBITRARY: 0
    ports:
      - 9181:80
    depends_on:
      - db
    networks:
      - sarpras-network
    restart: unless-stopped

networks:
  sarpras-network:
    driver: bridge

volumes:
  db-data:
  sarpras-vendor: