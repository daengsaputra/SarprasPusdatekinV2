stages:
  - test
  - deploy

test-app:
  stage: test
  tags:
    - sarpras-prod
  only:
    - main
  script:
    - php -v
    - composer --version
    - git --version

deploy-production:
  stage: deploy
  tags:
    - sarpras-prod
  only:
    - main
  script:
    - echo "Deploying production..."
    - sudo -u vsarpras bash -c '
        cd /var/www/web_sarpras/sarprasv2/sarprasv2 &&
        git pull origin main &&
        composer install --no-interaction --prefer-dist --optimize-autoloader &&
        php artisan optimize:clear
      '