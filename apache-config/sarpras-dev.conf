<VirtualHost *:80>
    ServerAdmin admin@bpip.go.id
    ServerName latihan-sarpras.bpip.go.id

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://localhost:9180/
    ProxyPassReverse / http://localhost:9180/

    DocumentRoot /var/www/bpip-sarpras-v2/public

    <Directory /var/www/bpip-sarpras-v2>
        Options -Indexes +FollowSymlinks -MultiViews +ExecCGI
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /var/log/apache2/latihan-sarpras.bpip.go.id.error.log
    CustomLog /var/log/apache2/latihan-sarpras.bpip.go.id.log combined
    ServerSignature Off
</VirtualHost>